<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Canteen Management System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1 id="shop">Canteen Management System</h1><small>Fast, accurate billing &amp; records</small></header>
<nav>
<button data-a="tab" data-id="bill" class="on">Billing</button><button data-a="tab" data-id="orders">Orders</button>
<button data-a="tab" data-id="reports">Reports</button><button data-a="tab" data-id="menu">Menu</button></nav>
<main>
<section id="v-bill"><div class="cols">
 <div class="card"><input id="q" placeholder="Search item… (press Enter to add the first match, “/” to focus)"><div class="chips" id="chips"></div><div class="grid" id="grid"></div></div>
 <div class="card"><h2>Current Order</h2><div id="cart"></div>
  <div class="f2"><input id="disc" type="number" min="0" step="any" placeholder="Discount"><select id="dtype"><option value="%">Discount in %</option><option value="₹">Discount in ₹</option></select></div>
  <div class="f2"><select id="pay"><option>Cash</option><option>UPI</option><option>Card</option></select><input id="rcv" type="number" min="0" step="any" placeholder="Cash received"></div>
  <div style="margin-top:8px" id="sums"></div>
  <button class="btn" id="gen" data-a="gen" disabled>Generate Bill</button><button class="btn alt" data-a="clr">Clear Order</button></div>
</div></section>

<section id="v-orders" hidden><div class="card"><h2>Order History</h2>
 <div class="f2"><input id="oq" placeholder="Search bill no. or item"><input id="od" type="date"></div><div id="olist" style="margin-top:8px"></div></div></section>

<section id="v-reports" hidden><div class="card"><h2>Sales Report</h2>
 <select id="rng"><option value="1">Today</option><option value="7">Last 7 days</option><option value="0">All time</option></select>
 <div class="kpis" id="kpis" style="margin-top:10px"></div></div>
 <div class="card"><h2>Top Selling Items</h2><div id="top"></div></div>
 <div class="card"><h2>Payment Modes</h2><div id="pm"></div></div>
 <div class="card"><h2>Low Stock (5 or fewer)</h2><div id="low"></div></div></section>

<section id="v-menu" hidden>
 <div class="card"><h2 id="fh">Add Item</h2>
  <div class="f2"><input id="nn" placeholder="Item name"><input id="np" type="number" min="0" step="any" placeholder="Price"></div>
  <div class="f2"><input id="nc" placeholder="Category (e.g. Snacks)"><input id="ns" type="number" min="0" step="1" placeholder="Stock (blank = unlimited)"></div>
  <button class="btn" data-a="save">Save Item</button><button class="btn alt" data-a="cancel" id="cx" hidden>Cancel Edit</button></div>
 <div class="card"><h2>Menu Items</h2><div id="mlist"></div></div>
 <div class="card"><h2>Settings &amp; Data</h2>
  <div class="f2"><input id="cn" placeholder="Canteen name"><input id="tx" type="number" min="0" step="any" placeholder="Tax % on bills"></div>
  <button class="btn sm" data-a="cfg">Save Settings</button>
  <p class="muted">Records are stored in this browser. Back up regularly.</p>
  <button class="btn alt sm" data-a="csv">Export CSV</button><button class="btn alt sm" data-a="bak">Backup</button><button class="btn alt sm" data-a="rst">Restore</button><button class="btn alt sm" data-a="wipe" style="color:var(--bad)">Reset All Data</button></div>
</section>
</main>

<div class="ov" id="rc"><div class="box"><div class="bill" id="bb"></div>
 <button class="btn np" data-a="prt">Print Bill</button><button class="btn alt np" data-a="done">Close</button></div></div>
<div class="ov" id="dg"><div class="dbox"><h2 id="dt"></h2><textarea id="dx"></textarea>
 <button class="btn sm" data-a="copy">Copy</button><button class="btn sm" data-a="dl">Download</button><button class="btn sm" data-a="apply" id="ap" hidden>Restore Now</button><button class="btn alt sm" data-a="dclose">Close</button></div></div>

<script src="script.js"></script>
</body>
</html>
